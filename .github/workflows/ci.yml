# Third-party actions are pinned to a full commit SHA (with the human-readable
# version in a trailing comment). Renovate keeps the SHAs fresh — see
# /renovate.json. Do NOT replace a SHA with a floating tag.
#
# Fork PR gating: jobs only run when one of the following is true:
#   1. event is a push / manual dispatch (always from a trusted ref)
#   2. event is a pull_request from a branch in this same repo
#   3. the pull_request carries the `ok-to-test` label (maintainer opt-in)
# The companion workflow `.github/workflows/ok-to-test-reset.yml` removes the
# label when the fork author pushes new commits, so labeling is never a
# blanket trust.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Cancel in-progress runs when a new push lands on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Gate · ok-to-test
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        (github.event.pull_request.head.repo.full_name == github.repository ||
         contains(github.event.pull_request.labels.*.name, 'ok-to-test')))
    steps:
      - name: Report gate state
        run: |
          echo "event=${{ github.event_name }}"
          echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}"
          echo "labels=${{ toJSON(github.event.pull_request.labels) }}"
          echo "Gate open — trusted run."

  ui:
    name: UI · typecheck · test · build
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
        env:
          CI: "true"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-results
          path: junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          files: coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Production build
        run: npm run build

      - name: Upload build output
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  chart:
    name: Helm · lint · template
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.15.4

      - name: Helm lint
        run: helm lint deploy/helm/emeland-ui

      - name: Helm template (defaults)
        run: helm template ci deploy/helm/emeland-ui --namespace emeland > /tmp/default.yaml

      - name: Helm template (OIDC + ingress + override token)
        run: |
          helm template ci deploy/helm/emeland-ui \
            --namespace emeland \
            --set config.oidc.enabled=true \
            --set config.oidc.authority=https://auth.example.com/realms/emeland \
            --set ingress.enabled=true \
            --set ingress.className=nginx \
            --set rootAdmin.tokenOverride=ci-test-token \
            --set autoscaling.enabled=true \
            > /tmp/overrides.yaml

      - name: Assert token hash matches across Secret and ConfigMap
        run: |
          set -euo pipefail
          # sha256 of literal "ci-test-token"
          expected="$(printf 'ci-test-token' | sha256sum | awk '{print $1}')"
          hashes=$(grep -Eo 'tokenSha256: "[a-f0-9]+"' /tmp/overrides.yaml | awk -F'"' '{print $2}' | sort -u)
          echo "Distinct hashes rendered:"
          echo "$hashes"
          count=$(echo "$hashes" | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error ::Secret and ConfigMap token hashes diverged"
            exit 1
          fi
          if [ "$hashes" != "$expected" ]; then
            echo "::error ::Rendered hash does not match sha256(ci-test-token)"
            exit 1
          fi

  docker:
    name: Docker · build
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: emeland-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker run -d --rm --name emeland-ui-ci -p 18080:8080 emeland-ui:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18080/healthz > /dev/null; then
              echo "healthz OK"
              break
            fi
            sleep 1
            if [ "$i" = "30" ]; then
              docker logs emeland-ui-ci
              exit 1
            fi
          done
          curl -sf http://localhost:18080/config.js | grep -q EMELAND_UI_CONFIG
          curl -sf http://localhost:18080/ | grep -q 'id="app"'
          docker stop emeland-ui-ci
