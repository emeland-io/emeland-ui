apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "emeland-ui.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "emeland-ui.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          URL="http://{{ include "emeland-ui.fullname" . }}:{{ .Values.service.port }}"
          curl --fail --silent --show-error "$URL/healthz"
          curl --fail --silent --show-error "$URL/config.js" | grep -q EMELAND_UI_CONFIG
