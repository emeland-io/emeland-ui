server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The runtime config.js is written by the Helm ConfigMap; it must never be
  # cached by the browser, or a redeploy won't pick up new OIDC settings.
  location = /config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # Hashed assets emitted by Vite are immutable — cache them hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # SPA fallback: everything that doesn't match a static file goes to index.html
  # so the OIDC callback and future client-side routes resolve client-side.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Health probes for Kubernetes.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Block access to files we never want to serve.
  location ~ /\.(git|env) { deny all; }
}
